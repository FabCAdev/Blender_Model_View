<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo Medieval Interactivo</title>
    <!-- Importar model-viewer de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            font-family: Arial, sans-serif; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { margin-bottom: 5px; font-size: 1.5rem; }
        p { color: #888; font-size: 0.9rem; margin-top: 0; }
        model-viewer { 
            width: 85%; 
            height: 70vh; 
            background-color: #1e1e1e; 
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls { 
            display: flex; 
            gap: 15px; 
            margin-top: 20px; 
        }
        button { 
            padding: 10px 20px; 
            background: #d4af37; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            transition: background 0.3s;
        }
        button:hover { background: #b89728; }
    </style>
</head>
<body>

    <h1>Escudo Medieval PBR</h1>
    <p>Proyecto Personal Interactivo - Web Real-Time</p>

    <!-- Visor 3D de Google (Asegúrate de que tu archivo se llame Escudo.glb o cámbiale el nombre aquí) -->
    <model-viewer id="escudo" src="Escudo.glb" alt="Escudo Medieval 3D" 
        auto-rotate 
        camera-controls 
        shadow-intensity="3.0" 
        shadow-softness="0.5" 
        exposure="0.6"
        environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"
        skybox-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr">
    </model-viewer>

    <!-- 3 Botones Interactivos (Requisito de la rúbrica) -->
    <div class="controls">
        <button onclick="cambiarColorAcero()">Cambiar Color Acero</button>
        <button onclick="alternarRotacion()">Alternar Rotación</button>
        <button onclick="resetearVista()">Reiniciar Vista</button>
    </div>

    <script>
        const viewer = document.querySelector('#escudo');

        // Botón 1: Cambia el color base del material de acero dinámicamente
        function cambiarColorAcero() {
            // Nota: El índice [0] u otro depende de cómo se ordenaron los materiales al exportar
            const material = viewer.model.materials[0]; 
            if (material) {
                // Genera un color aleatorio para el acero/metal
                const r = Math.random();
                const g = Math.random();
                const b = Math.random();
                material.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1.0]);
            } else {
                alert("No se encontró el material de acero para modificar.");
            }
        }

        // Botón 2: Activa o pausa la rotación automática correctamente
        function alternarRotacion() {
            // Alterna el atributo en la etiqueta HTML de model-viewer de forma directa
            viewer.toggleAttribute('auto-rotate');
}

        // Botón 3: Restablece la posición inicial de la cámara
        function resetearVista() {
            viewer.cameraOrbit = "0deg 75deg 105m";
            viewer.fieldOfView = "30deg";
        }
    </script>

</body>
</html>
